name: Daily tender scrape

on:
  schedule:
    # 01:00 UTC = 06:30 IST, every day
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test parsers
        run: python tests/test_parsers.py

      - name: Run scraper
        run: python -m scraper.run

      - name: Commit updated data
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Tender data update $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
