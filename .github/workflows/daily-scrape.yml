name: Daily tender scrape

on:
  schedule:
    # 01:00 UTC = 06:30 IST, every day
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      detail_budget:
        description: "Tender detail pages to fetch this run (default 1200)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test parsers
        run: python tests/test_parsers.py

      - name: Run scraper
        env:
          DETAIL_BUDGET: ${{ github.event.inputs.detail_budget }}
        run: python -m scraper.run

      - name: Commit tender data
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Tender data update $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # Needs the ANTHROPIC_API_KEY repository secret; skipped quietly without it.
      # Optional repository variables: AI_MODEL, AI_EFFORT, AI_DAILY_LIMIT.
      - name: AI analysis
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
        run: python -m scraper.ai_analysis

      - name: Commit AI analysis
        run: |
          git add -A docs/data data
          if git diff --cached --quiet; then
            echo "No AI changes."
          else
            git commit -m "AI analysis update $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
